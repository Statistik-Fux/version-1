<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handball Statistik</title>

<!-- Cache verhindern -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache, no-store" />
<meta http-equiv="Expires" content="0" />

<style>
body { font-family: Arial, sans-serif; margin: 0; background-color: #fff; }
body::before, body::after {
    content: ""; position: fixed; top: 50%; transform: translateY(-50%);
    width: 70vw; height: 90vh; background-repeat: no-repeat; background-position: center;
    background-size: contain; opacity: 0.15; filter: blur(0.5px);
    z-index: -1; pointer-events: none;
}
body::before { left: 15%; }
body::after { right: 15%; }
h1, h2 { text-align: center; margin-bottom: 15px; }
#setup { background: rgba(255, 255, 255, 0.6); padding: 20px; border-radius: 12px;
    max-width: 500px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
#opponent, #teamSelect { font-size: 1.1em; padding: 12px; width: 100%; margin-bottom: 20px;
    border: 1px solid #ccc; border-radius: 8px; background-color: rgba(255,255,255,0.85);
    transition: border-color 0.3s, box-shadow 0.3s; color: black;
}
#opponent:focus, #teamSelect:focus { outline: none; border-color: #009688; box-shadow: 0 0 5px rgba(0,150,136,0.5); }
#player-selection { display: flex; gap: 10px; flex-wrap: nowrap; justify-content: space-between; }
#player-selection .column { width: 48%; display: flex; flex-direction: column; gap: 8px; }
#player-selection label { cursor: pointer; font-size: 1em; padding: 4px 0; }
#player-selection input[type="checkbox"] { margin-right: 6px; transform: scale(1.2); }
.add-player-container { margin-top: 15px; display: flex; gap: 5px; }
.add-player-container input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
.add-player-container select { margin-left:5px; padding:6px; border-radius:6px; border:1px solid #ccc; }
.add-player-container button { padding: 8px 12px; border: none; border-radius: 6px;
    background-color: #009688; color: white; cursor: pointer; font-size: 1em; }
.add-player-container button:hover { background-color: #00796b; }
.start-btn {
    font-size: 1.3em; padding: 12px 15px; background: linear-gradient(90deg, #009688, #26a69a);
    color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px;
    transition: background 0.3s, transform 0.1s;
}
.start-btn:hover { background: linear-gradient(90deg, #00796b, #26a69a); }
.start-btn:active { transform: scale(0.98); }
.player-card { border-radius: 8px; padding: 10px; margin: 10px; flex: 1; min-width: 250px;
    background: white; box-shadow: 0 3px 8px rgba(0,0,0,0.05); }
.player-name { font-weight: bold; font-size: 1.4em; text-align: center; margin-bottom: 10px; }
.grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px; }
.btn { width: 31%; padding: 8px; margin: 2px 1%; border: none; cursor: pointer;
    font-size: 0.9em; border-radius: 6px; user-select: none; }
.positive { background-color: #d4edda; }
.negative { background-color: #f8d7da; }
.full-width { width: 98%; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: white; font-size: 0.9em; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
th { background: #f0f0f0; }
.thick-separator { border-left: 3px solid black !important; }
.export-buttons { margin-top: 20px; text-align: center; }
.hidden { display: none; }

/* Anzeige der vergangenen zehn Angriffe */
#attackOverview {
    max-width: 1000px;
    margin: 15px auto 0;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.88);
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
}
.attack-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 7px 0;
    flex-wrap: wrap;
}
.attack-label {
    font-weight: bold;
    min-width: 90px;
}
.attack-dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}
.attack-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
}
.attack-dot.goal {
    background-color: #2e7d32;
}
.attack-dot.miss {
    background-color: #c62828;
}
.attack-group-gap {
    width: 22px;
    flex-shrink: 0;
}
#tfOpponentBtn {
    margin-left: auto;
    padding: 8px 14px;
    font-size: 0.9em;
    border: none;
    border-radius: 6px;
    background-color: #ffd54f;
    color: #333;
    cursor: pointer;
    user-select: none;
}
#tfOpponentBtn:active {
    transform: scale(0.97);
}

/* Notiz-Feld */
#notesContainer {
    max-width: 1000px;
    margin: 20px auto;
    padding: 10px;
}
#notesContainer label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}
#notes {
    width: 100%;
    min-height: 80px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    resize: vertical;
}

@media (max-width: 768px) {
    .btn { width: 48%; font-size: 0.85em; padding: 6px; }
    .player-card { min-width: unset; width: 100%; }
    #player-selection { flex-direction: column; }
    #player-selection .column { width: 100%; }
    table { font-size: 0.8em; }
    #tfOpponentBtn {
        margin-left: 0;
        width: 100%;
        margin-top: 8px;
    }
}
</style>
</head>
<body>
<main id="setup">
<h1>Willkommen!</h1>
<input type="text" id="opponent" placeholder="Gegner eingeben">
<select id="teamSelect">
    <option value="Fux2">Fux2</option>
    <option value="FuxA">FuxA</option>
</select>
<section id="player-selection">
    <div class="column" id="col1"></div>
    <div class="column" id="col2"></div>
</section>
<div class="add-player-container">
    <input type="text" id="newPlayerName" placeholder="Spielername eingeben">
    <select id="newPlayerCategory">
        <option value="Rückraum">Rückraum</option>
        <option value="Außen">Außen</option>
        <option value="Kreis">Kreis</option>
        <option value="Torhüter">Torhüter</option>
    </select>
    <button type="button" id="addPlayerBtn">+</button>
</div>
<button class="start-btn" id="startBtn">Start</button>
</main>

<h1 id="headline" class="hidden"></h1>

<div id="attackOverview" class="hidden">
    <div class="attack-row">
        <span class="attack-label">Fux2:</span>
        <div class="attack-dots" id="fuxAttackDots"></div>
    </div>
    <div class="attack-row">
        <span class="attack-label" id="opponentAttackLabel">Gegner:</span>
        <div class="attack-dots" id="opponentAttackDots"></div>
    </div>
    <button type="button" id="tfOpponentBtn">TF Gegner</button>
</div>

<div id="players" class="grid"></div>

<div class="export-buttons hidden" id="playerExport">
    <button data-export="excel" data-table="playerTable">Export Excel (Spieler)</button>
    <button data-export="pdf">Export PDF (komplett)</button>
</div>
<div id="playerStats"></div>

<div class="export-buttons hidden" id="teamExport">
    <button data-export="excel" data-table="teamTable">Export Excel (Team)</button>
</div>
<div id="teamStats"></div>

<!-- Notiz-Feld unter der Teamstatistik -->
<div id="notesContainer" class="hidden">
    <label for="notes">Notizen:</label>
    <textarea id="notes" placeholder="Notizen zum Spiel eingeben..."></textarea>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

(() => {
    const cb = Date.now();
    const col1 = document.getElementById("col1");
    const col2 = document.getElementById("col2");
    const startBtn = document.getElementById("startBtn");
    const teamSelect = document.getElementById("teamSelect");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const newPlayerNameInput = document.getElementById("newPlayerName");
    const newPlayerCategorySelect = document.getElementById("newPlayerCategory");
    const notesContainer = document.getElementById("notesContainer");
    const notesElement = document.getElementById("notes");

    let currentOpponent = "";

    const teams = {
        Fux2: ["Julian Kusche","Gabriel Kofler","Adrian Babet","Fynn Paulicks","Rune Laskowski","Navi Yatawarage","Antonio D'Incecco","Leo Nowak","Simon Sirot","Emil Fiedler","Suad Pajaziti","Lennart Steltner","Luca Thiel","Lucas Mohr","Jonas Kofler","Kyrill Höllein","Davide Babini","Pius Joppich","Henning Lahuis","Tempo"],
        FuxA: ["Leo Nowak","Simon Poppe","Fritz Parke","Fynn Paulicks","Filip Dominikovic","Leo Tautenhahn","Antonio D'Incecco","Maxime Brodier","Simon Sirot","Albert Schmidt","Gabor Zeuch","Christopher Losch","Davide Babini","Dominik Barth","Henning Lahuis","Ole Krake","Matteo Agistonelli","Tempo"]
    };

    const categories = {
        Fux2: [...Array(8).fill("Rückraum"), ...Array(5).fill("Außen"), ...Array(4).fill("Kreis"), ...Array(2).fill("Torhüter"), ...Array(1).fill("Tempo")],
        FuxA: [...Array(8).fill("Rückraum"), ...Array(4).fill("Außen"), ...Array(2).fill("Kreis"), ...Array(3).fill("Torhüter"), ...Array(1).fill("Tempo")]
    };

    let playerNames = [...teams.Fux2];
    let playerCategories = [...categories.Fux2];

    const actionsPositive = [
        {key:"KM_pos",label:"KM"},
        {key:"DBR_pos",label:"DBR"},
        {key:"AUSSEN_pos",label:"Außen"},
        {key:"NAH_pos",label:"NAH"},
        {key:"FERN_pos",label:"FERN"},
        {key:"TGS_pos",label:"TGS"},
        {key:"LT_pos",label:"Leeres"},
        {key:"7M_pos",label:"7M"}
    ];
    const actionsNegative = [
        {key:"KM_neg",label:"KM"},
        {key:"DBR_neg",label:"DBR"},
        {key:"AUSSEN_neg",label:"Außen"},
        {key:"NAH_neg",label:"NAH"},
        {key:"FERN_neg",label:"FERN"},
        {key:"TGS_neg",label:"TGS"},
        {key:"LT_neg",label:"Leeres"},
        {key:"7M_neg",label:"7M"},
        {key:"TF_neg",label:"TF"}
    ];

    let playersData = {};
    let pressTimer, longPressActive, activeTouch;

    // Angriffsanzeige: Der jeweils neueste Angriff steht links.
    const MAX_ATTACKS = 10;
    let fuxAttackHistory = [];
    let opponentAttackHistory = [];

    const fuxAttackDots = document.getElementById("fuxAttackDots");
    const opponentAttackDots = document.getElementById("opponentAttackDots");
    const opponentAttackLabel = document.getElementById("opponentAttackLabel");
    const tfOpponentBtn = document.getElementById("tfOpponentBtn");
    const attackOverview = document.getElementById("attackOverview");

    function renderAttackDots(container, history) {
        container.innerHTML = "";

        history.forEach((attack, index) => {
            // Nach den ersten fünf Angriffen einen kleinen Abstand einfügen.
            if (index === 5) {
                const gap = document.createElement("span");
                gap.className = "attack-group-gap";
                container.appendChild(gap);
            }

            const dot = document.createElement("span");
            dot.className = "attack-dot " + (attack.scored ? "goal" : "miss");
            container.appendChild(dot);
        });
    }

    function renderAttacks() {
        renderAttackDots(fuxAttackDots, fuxAttackHistory);
        renderAttackDots(opponentAttackDots, opponentAttackHistory);
    }

    function addAttack(team, scored) {
        const history = team === "fux" ? fuxAttackHistory : opponentAttackHistory;

        history.unshift({ scored: scored });
        if (history.length > MAX_ATTACKS) {
            history.length = MAX_ATTACKS;
        }

        renderAttacks();
    }

    function removeLastAttack(team, scored) {
        const history = team === "fux" ? fuxAttackHistory : opponentAttackHistory;
        const index = history.findIndex(attack => attack.scored === scored);

        if (index !== -1) {
            history.splice(index, 1);
            renderAttacks();
        }
    }

    function registerAttackFromButton(playerNumber, actionKey, isPositive) {
        const category = playerCategories[playerNumber - 1];

        if (category === "Tempo") {
            return;
        }

        // TF eines Torhüters wird wie TF eines Feldspielers behandelt:
        // kein Tor von Fux2; für den Gegner wird kein Angriff erfasst.
        if (category === "Torhüter" && actionKey === "TF_neg") {
            addAttack("fux", false);
            return;
        }

        if (category === "Torhüter") {
            // Grüner Torhüter-Button: Gegner hat kein Tor geworfen.
            // Roter Torhüter-Button: Gegner hat ein Tor geworfen.
            addAttack("opponent", !isPositive);
            return;
        }

        // Feldspieler: Grüner Button = Fux2-Tor, roter Button = kein Fux2-Tor.
        addAttack("fux", isPositive);
    }

    function removeAttackFromButton(playerNumber, actionKey, isPositive) {
        const category = playerCategories[playerNumber - 1];

        if (category === "Tempo") {
            return;
        }

        // TF eines Torhüters wird wie TF eines Feldspielers behandelt.
        if (category === "Torhüter" && actionKey === "TF_neg") {
            removeLastAttack("fux", false);
            return;
        }

        if (category === "Torhüter") {
            removeLastAttack("opponent", !isPositive);
            return;
        }

        removeLastAttack("fux", isPositive);
    }

    function handleTfOpponentPress() {
        longPressActive = false;
        pressTimer = setTimeout(() => {
            removeLastAttack("opponent", false);
            longPressActive = true;
        }, 500);
    }

    function handleTfOpponentRelease() {
        clearTimeout(pressTimer);
        if (!longPressActive) {
            // TF Gegner bedeutet: kein Tor des Gegners.
            addAttack("opponent", false);
        }
    }

    tfOpponentBtn.addEventListener("mousedown", () => {
        if (!activeTouch) handleTfOpponentPress();
    });
    tfOpponentBtn.addEventListener("mouseup", () => {
        if (!activeTouch) handleTfOpponentRelease();
    });
    tfOpponentBtn.addEventListener("mouseleave", () => clearTimeout(pressTimer));
    tfOpponentBtn.addEventListener("touchstart", event => {
        activeTouch = true;
        handleTfOpponentPress();
        event.preventDefault();
    });
    tfOpponentBtn.addEventListener("touchend", event => {
        handleTfOpponentRelease();
        setTimeout(() => activeTouch = false, 300);
        event.preventDefault();
    });
    tfOpponentBtn.addEventListener("touchcancel", () => clearTimeout(pressTimer));

    window.addEventListener("load", () => {
        document.styleSheets[0].cssRules[1].style.backgroundImage = `url('logo.png.JPG?cb=${cb}')`;
        document.styleSheets[0].cssRules[2].style.backgroundImage = `url('logo.png.JPG?cb=${cb}')`;
        renderPlayerCheckboxes();
    });

    function renderPlayerCheckboxes() {
        col1.innerHTML = ""; col2.innerHTML = "";
        playerNames.forEach((name,i) => {
            const label = document.createElement("label");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox"; checkbox.value = i + 1;
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(` ${name}`));
            (i < Math.ceil(playerNames.length / 2) ? col1 : col2).appendChild(label);
        });
    }

    teamSelect.addEventListener("change", () => {
        playerNames = [...teams[teamSelect.value]];
        playerCategories = [...categories[teamSelect.value]];
        renderPlayerCheckboxes();
    });

    addPlayerBtn.addEventListener("click", () => {
        const n = newPlayerNameInput.value.trim();
        const cat = newPlayerCategorySelect.value;
        if(n){
            let insertIndex = playerCategories.findLastIndex(c => c === cat);
            if(insertIndex === -1) insertIndex = playerCategories.length - 1;
            else insertIndex = insertIndex + 1;
            playerNames.splice(insertIndex,0,n);
            playerCategories.splice(insertIndex,0,cat);
            renderPlayerCheckboxes();
            newPlayerNameInput.value="";
        }
    });

    function validateAndStart() {
        const opponent = document.getElementById("opponent").value.trim();
        const selected = Array.from(document.querySelectorAll("#player-selection input:checked"));
        if (!opponent || selected.length < 7) {
            alert("Bitte korrigieren:\n- Gegner eingeben\n- Mindestens 7 Spieler auswählen");
            return;
        }
        currentOpponent = opponent;
        startGame(opponent, selected.map(cb => parseInt(cb.value)));
    }

    function startGame(opponent, selectedPlayers) {
        document.getElementById("headline").innerText = `Statistik vs ${opponent}`;
        opponentAttackLabel.textContent = `${opponent}:`;
        document.getElementById("setup").classList.add("hidden");
        document.getElementById("headline").classList.remove("hidden");
        document.getElementById("playerExport").classList.remove("hidden");
        document.getElementById("teamExport").classList.remove("hidden");
        notesContainer.classList.remove("hidden");
        attackOverview.classList.remove("hidden");
        const playersDiv = document.getElementById("players");
        playersDiv.innerHTML = "";

        fuxAttackHistory = [];
        opponentAttackHistory = [];
        renderAttacks();

        selectedPlayers.forEach(num => {
            playersData[num] = {};
            [...actionsPositive, ...actionsNegative].forEach(a => playersData[num][a.key] = 0);
            const card = document.createElement("div");
            card.className = "player-card";
            const nameDiv = document.createElement("div");
            nameDiv.className = "player-name"; nameDiv.textContent = playerNames[num - 1];
            card.appendChild(nameDiv);

            [...actionsPositive, ...actionsNegative].forEach((a, idx) => {
                const btn = document.createElement("button");
                const isPositive = idx < actionsPositive.length;
                btn.className = `btn ${isPositive ? "positive" : "negative"}`;
                if (a.key.startsWith("TF") && idx >= actionsPositive.length) btn.classList.add("full-width");
                btn.textContent = `${a.label} (0)`;

                const startPress = () => {
                    longPressActive = false;
                    pressTimer = setTimeout(() => {
                        playersData[num][a.key] = Math.max(0, playersData[num][a.key] - 1);
                        btn.textContent = `${a.label} (${playersData[num][a.key]})`;
                        updateTables();
                        removeAttackFromButton(num, a.key, isPositive);
                        longPressActive = true;
                    }, 500);
                };
                const endPress = () => {
                    clearTimeout(pressTimer);
                    if (!longPressActive) {
                        playersData[num][a.key]++;
                        btn.textContent = `${a.label} (${playersData[num][a.key]})`;
                        updateTables();
                        registerAttackFromButton(num, a.key, isPositive);
                    }
                };
                btn.addEventListener("mousedown", e => { if (!activeTouch) startPress(); });
                btn.addEventListener("mouseup", e => { if (!activeTouch) endPress(); });
                btn.addEventListener("mouseleave", () => clearTimeout(pressTimer));
                btn.addEventListener("touchstart", e => { activeTouch = true; startPress(); e.preventDefault(); });
                btn.addEventListener("touchend", e => { endPress(); setTimeout(() => activeTouch = false, 300); e.preventDefault(); });
                btn.addEventListener("touchcancel", () => clearTimeout(pressTimer));

                card.appendChild(btn);
                if (idx === actionsPositive.length - 1) {
                    const sep = document.createElement("div");
                    sep.style.borderBottom = "3px solid black";
                    sep.style.margin = "5px 0";
                    card.appendChild(sep);
                }
            });
            playersDiv.appendChild(card);
        });
        updateTables();
    }

    function updateTables() {
        const buildTable = (id, header1, rows) => {
            let extraHeaders = id === "teamTable" ? "<th>TW</th>" : "";
            let extraNameHeader = id === "playerTable" ? "<th>Spieler</th>" : "";
            let headerRow = `<tr><th>${header1}</th>` +
                actionsPositive.map(a => `<th>${a.label}</th>`).join("") +
                actionsNegative.map((a,i) => `<th class="${i===0 ? "thick-separator" : ""}">${a.label}</th>`).join("") +
                `<th>WQ</th><th>WQ inkl. TF</th>` + extraHeaders + extraNameHeader + `</tr>`;
            return `<table id="${id}">${headerRow}${rows}</table>`;
        };

        // Spielerstatistik
        let playerRows = "";
        let lastCategory = null;
        Object.keys(playersData).forEach(num => {
            const cat = playerCategories[num-1];
            if (lastCategory && lastCategory !== cat) {
                playerRows += `<tr><td colspan="${actionsPositive.length + actionsNegative.length + 2 + 1 + 1}"></td></tr>`;
            }
            lastCategory = cat;

            let posSum = actionsPositive.reduce((s,a)=>s+playersData[num][a.key],0);
            let negSumExTF = actionsNegative.filter(a=>a.key!=="TF_neg").reduce((s,a)=>s+playersData[num][a.key],0);
            let negSum = actionsNegative.reduce((s,a)=>s+playersData[num][a.key],0);

            let wq = posSum+negSumExTF>0 ? (posSum/(posSum+negSumExTF)*100).toFixed(1)+"%" : "-";
            let wqTF = posSum+negSum>0 ? (posSum/(posSum+negSum)*100).toFixed(1)+"%" : "-";

            playerRows += `<tr><td>${playerNames[num-1]}</td>` +
                actionsPositive.map(a => `<td>${playersData[num][a.key]}</td>`).join("") +
                actionsNegative.map((a,i) => `<td class="${i===0 ? "thick-separator" : ""}">${playersData[num][a.key]}</td>`).join("") +
                `<td>${wq}</td><td>${wqTF}</td><td>${playerNames[num-1]}</td></tr>`;
        });
        document.getElementById("playerStats").innerHTML = buildTable("playerTable", "Spieler", playerRows);

        // Teamstatistik
        const playerKeys = Object.keys(playersData);

        const getCategory = playerKey => {
            return playerCategories[Number(playerKey) - 1];
        };

        // Alle normalen Werte: Torhüter und Tempo werden ausgeschlossen.
        const regularPlayers = playerKeys.filter(playerKey => {
            const category = getCategory(playerKey);
            return category !== "Torhüter" && category !== "Tempo";
        });

        // TF: Torhüter werden mitgerechnet, Tempo bleibt ausgeschlossen.
        const tfPlayers = playerKeys.filter(playerKey => {
            return getCategory(playerKey) !== "Tempo";
        });

        // TW: ausschließlich Torhüter.
        const goalkeeperPlayers = playerKeys.filter(playerKey => {
            return getCategory(playerKey) === "Torhüter";
        });

        const sumAction = (players, actionKey) => {
            return players.reduce((sum, playerKey) => {
                return sum + (playersData[playerKey][actionKey] || 0);
            }, 0);
        };

        const sumActions = (players, actions) => {
            return actions.reduce((sum, action) => {
                return sum + sumAction(players, action.key);
            }, 0);
        };

        // Positive Aktionen ohne Torhüter und Tempo.
        const posTotalRegular = sumActions(
            regularPlayers,
            actionsPositive
        );

        // Negative Aktionen ohne TF, ebenfalls ohne Torhüter und Tempo.
        const negTotalExTFRegular = sumActions(
            regularPlayers,
            actionsNegative.filter(action => action.key !== "TF_neg")
        );

        // TF einschließlich Torhüter, aber ohne Tempo.
        const tfTotal = sumAction(tfPlayers, "TF_neg");

        // Negative Gesamtwerte inklusive TF.
        const negTotalIncludingTF = negTotalExTFRegular + tfTotal;

        // WQ ohne TF.
        const teamWQ =
            posTotalRegular + negTotalExTFRegular > 0
                ? (
                    posTotalRegular /
                    (posTotalRegular + negTotalExTFRegular) *
                    100
                ).toFixed(1) + "%"
                : "-";

        // WQ inklusive TF.
        const teamWQTF =
            posTotalRegular + negTotalIncludingTF > 0
                ? (
                    posTotalRegular /
                    (posTotalRegular + negTotalIncludingTF) *
                    100
                ).toFixed(1) + "%"
                : "-";

        // TW ausschließlich aus den Torhüter-Werten.
        const posGoalkeepers = sumActions(
            goalkeeperPlayers,
            actionsPositive
        );

        const negExTFGoalkeepers = sumActions(
            goalkeeperPlayers,
            actionsNegative.filter(action => action.key !== "TF_neg")
        );

        const tw =
            posGoalkeepers + negExTFGoalkeepers > 0
                ? (
                    posGoalkeepers /
                    (posGoalkeepers + negExTFGoalkeepers) *
                    100
                ).toFixed(1) + "%"
                : "-";

        const teamRow = `<tr><td>Gesamt</td>` +
            actionsPositive.map(action =>
                `<td>${sumAction(regularPlayers, action.key)}</td>`
            ).join("") +
            actionsNegative.map((action, index) => {
                const playersForAction =
                    action.key === "TF_neg"
                        ? tfPlayers
                        : regularPlayers;

                return `<td class="${index === 0 ? "thick-separator" : ""}">
                    ${sumAction(playersForAction, action.key)}
                </td>`;
            }).join("") +
            `<td>${teamWQ}</td>
             <td>${teamWQTF}</td>
             <td>${tw}</td></tr>`;

        document.getElementById("teamStats").innerHTML = buildTable("teamTable", "Team", teamRow);
    }

    function exportTableToExcel(tableID) {
        const table = document.getElementById(tableID);
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.table_to_sheet(table, {raw: true});
        XLSX.utils.sheet_add_aoa(ws, [[`Statistik vs ${currentOpponent}`]], {origin: "A1"});
        ws['!cols'] = Array(table.rows[0].cells.length).fill({wch: 12});
        XLSX.utils.book_append_sheet(wb, ws, "Stats");
        XLSX.writeFile(wb, `${tableID}.xlsx`);
    }

    function exportCompletePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});

        // Titel
        doc.setFontSize(16);
        doc.text(`Statistik vs ${currentOpponent}`, 14, 15);

        // Spielerstatistik-Tabelle
        doc.autoTable({
            html: '#playerTable',
            startY: 20,
            theme: 'grid',
            styles: { lineWidth: 0.2, lineColor: [0,0,0], halign: 'center', valign: 'middle', fontSize: 8 },
            headStyles: { fillColor: [240,240,240], textColor: 0, lineWidth: 0.2, lineColor: [0,0,0] },
            didParseCell: (data) => {
                if (data.column.index === actionsPositive.length) {
                    data.cell.styles.lineLeftWidth = 4.5;
                    data.cell.styles.lineLeftColor = [0,0,0];
                }
            }
        });

        // Teamstatistik-Tabelle (unterhalb der Spielerstatistik)
        let currentY = doc.lastAutoTable.finalY + 10;

        doc.setFontSize(14);
        doc.text('Teamstatistik', 14, currentY);
        currentY += 5;

        doc.autoTable({
            html: '#teamTable',
            startY: currentY,
            theme: 'grid',
            styles: { lineWidth: 0.2, lineColor: [0,0,0], halign: 'center', valign: 'middle', fontSize: 10 },
            headStyles: { fillColor: [240,240,240], textColor: 0, lineWidth: 0.2, lineColor: [0,0,0] },
            didParseCell: (data) => {
                if (data.column.index === actionsPositive.length) {
                    data.cell.styles.lineLeftWidth = 4.5;
                    data.cell.styles.lineLeftColor = [0,0,0];
                }
            }
        });

        // Notizen unterhalb der Teamstatistik
        const finalY = doc.lastAutoTable.finalY;
        const notesText = notesElement.value || "";
        if (notesText.trim() !== "") {
            let y = finalY + 10;
            if (y > 180) {
                doc.addPage();
                y = 20;
            }
            doc.setFontSize(12);
            doc.text("Notizen:", 14, y);
            doc.setFontSize(10);
            const splitText = doc.splitTextToSize(notesText, 260);
            doc.text(splitText, 14, y + 6);
        }

        // Erstellt-am-Datum auf letzter Seite
        doc.setFontSize(10);
        const pageCount = doc.internal.getNumberOfPages();
        doc.setPage(pageCount);
        doc.text(`Erstellt am: ${new Date().toLocaleString()}`, 14, 200);

        doc.save(`Handball_Statistik_vs_${currentOpponent}.pdf`);
    }

    document.querySelectorAll("button[data-export]").forEach(btn => {
        btn.addEventListener("click", e => {
            const type = e.target.getAttribute("data-export");
            const table = e.target.getAttribute("data-table");
            if (type === "excel") exportTableToExcel(table);
            if (type === "pdf") exportCompletePDF();
        });
    });

    startBtn.addEventListener("click", validateAndStart);
})();
</script>
</body>
</html>
